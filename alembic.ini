# alembic.ini
#
# Alembic configuration for the Intelligent RBAC Policy Auditor.
#
# The script_location points at the migrations/ directory in the project
# root.  The sqlalchemy.url is intentionally left as a placeholder here
# because migrations/env.py reads DATABASE_URL from the environment at
# runtime, which keeps credentials out of version control.

[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# sqlalchemy.url is overridden in migrations/env.py via os.environ.
# The value below is a safe fallback for alembic CLI invocations that do
# not set DATABASE_URL; it matches the docker-compose default credentials.
sqlalchemy.url = postgresql://rbac_user:rbac_password@localhost:5432/rbac_auditor

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
