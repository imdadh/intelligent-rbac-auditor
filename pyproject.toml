[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligent-rbac-auditor"
version = "0.1.0"
description = "A production-grade service that audits Azure AD RBAC role assignments using structured LLM analysis to surface overprivileged accounts and dormant privileged role assignments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Imdad" },
]
keywords = ["rbac", "azure-ad", "iam", "security", "audit", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web framework and ASGI server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",

    # LLM orchestration
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.30.0",

    # Structured logging
    "structlog>=24.1.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # HTTP client
    "httpx>=0.27.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Synthetic data generation
    "faker>=25.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # required by FastAPI TestClient async support

    # Linting and formatting
    "ruff>=0.4.0",
]

[project.scripts]
generate-synthetic-data = "scripts.generate_synthetic_data:main"
seed-db = "scripts.seed_db:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: marks tests that require a live database and external services",
    "unit: marks fast, isolated unit tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = [
    "app/static/*",
    "*/migrations/*",
    "*/tests/*",
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # use of assert — acceptable in tests
    "S105",   # hardcoded password — triggers on env-var placeholder strings
    "S106",
    "B007",   # unused loop-control variable — LLM uses 
    "RUF001", # ambiguous unicode in string — LLMs use en/em dashes
    "RUF002", # ambiguous unicode in docstring — LLMs use en/em dashes
    "RUF003", # ambiguous unicode in comment — LLMs use en/em dashes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "RUF012"]  # mutable class attrs in test classes
"scripts/*" = ["S", "E501", "F841", "RUF"]  # data-gen scripts: all RUF rules suppressed
"migrations/*" = ["E501"]  # auto-generated migration files

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
